# 推送到 main：只跑测试 + 类型检查 + 构建。
# 打 v* 标签（发版）：再按 src/changelog.ts 创建 GitHub Release，并部署到 Cloudflare Pages（项目 my-home）。
# Secrets：CLOUDFLARE_API_TOKEN（权限 Account / Cloudflare Pages / Edit）、CLOUDFLARE_ACCOUNT_ID。未配置时跳过部署。
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # build 含 vue-tsc
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
      # 发版：三语更新日志写进 GitHub Release
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm exec vite-node scripts/release-notes.mts "$GITHUB_REF_NAME" > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1             && gh release edit "$GITHUB_REF_NAME" --notes-file notes.md             || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  deploy:
    # 只在发版（v* 标签）或手动触发时部署
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未配置，跳过部署"
            exit 0
          fi
          W="npx -y wrangler@4.146.0"
          # 首次部署时创建项目（已存在则忽略）
          $W pages project create my-home --production-branch main 2>/dev/null || true
          $W pages deploy dist --project-name my-home --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
