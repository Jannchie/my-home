# 推送到 main 或打 v* 标签：测试 + 类型检查 + 构建，部署到 Cloudflare Pages（项目 my-home）。
# Secrets：CLOUDFLARE_API_TOKEN（权限 Account / Cloudflare Pages / Edit）、CLOUDFLARE_ACCOUNT_ID。未配置时跳过部署。
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # build 含 vue-tsc
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未配置，跳过部署"
            exit 0
          fi
          W="npx -y wrangler@4.146.0"
          # 首次部署时创建项目（已存在则忽略）
          $W pages project create my-home --production-branch main 2>/dev/null || true
          $W pages deploy dist --project-name my-home --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
