          My Home 是在浏览器里运行的日式户型编辑器：随机生成 1K～3LDK 的日本住宅户型（ユニットバス、洗濯機置場、玄関、和室、阳台一应俱全），也能自己画。一键布置会先推断住户的家庭构成、职业、性格与兴趣，再按人设摆好家具和上千种生活小物。在
