<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>My Home · Promo</title>
    <!-- 宣传片录制页（只在开发服务器里用，不进生产构建）：固定随机种子，画面逐帧确定 -->
    <script>
      ;(() => {
        let a = 20261016 >>> 0
        Math.random = () => {
          a = (a + 0x6d2b79f5) >>> 0
          let t = a
          t = Math.imul(t ^ (t >>> 15), t | 1)
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }
        const fixed = Date.UTC(2026, 5, 21, 3, 0, 0)
        Date.now = () => fixed
        const o = Storage.prototype.setItem
        Storage.prototype.setItem = function (k, v) {
          if (k === 'my-home:plan') return
          return o.call(this, k, v)
        }
      })()
    </script>
  </head>
  <body>
    <div id="promo"></div>
    <script type="module" src="/src/promo/main.ts"></script>
  </body>
</html>
